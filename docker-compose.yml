services:

  postgres:
    image: postgres:17
    platform: linux/amd64
    container_name: collegehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manisha@4321
      POSTGRES_DB: collegehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collegehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: collegehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collegehub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000

      DATABASE_URL: "postgresql://postgres:manisha%404321@postgres:5432/collegehub"

      JWT_SECRET: "collegehubsecret"

      REDIS_URL: "redis://redis:6379"

      CLOUDINARY_CLOUD_NAME: "grcktyog"
      CLOUDINARY_API_KEY: "877475367584848"
      CLOUDINARY_API_SECRET: "REPLACE_WITH_NEW_SECRET"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collegehub-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: